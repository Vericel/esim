description: Complete two-step Rules demonstration for xxx.yyy
tags:
  - complete-rules
  - duplicate

include:
  - $DV_HOME/dtb_common/rules/vcs_base.rules
  - ${ESIM_DEMO_YYY_RULES}/full-left.rules
  - ./full-right.yaml

filelist: ${ESIM_DEMO_FILELIST}
simulator: vcs
flow: two-step

ff:
  args:
    - -d COMPLETE_YYY
  hooks:
    before:
      - echo "yyy rules-entry ff before"
    after:
      - echo "yyy rules-entry ff after"

build:
  args:
    - -top top_tb
  hooks:
    before:
      - echo "yyy rules-entry build before"
    after:
      - echo "yyy rules-entry build after"

run:
  args:
    - '+RULES_LABEL="$ESIM_DEMO_LABEL"'
  hooks:
    after:
      - echo "yyy rules-entry run after"
