description: Complete YAML feature testcase for xxx.yyy
owner: verification-platform
tags:
  - complete-tc
  - duplicate

include:
  - ../fragments/base.yaml
  - ${ESIM_DEMO_YYY_TESTS}/fragments/extended.tc

metadata:
  ticket: ignored-demo-value

build:
  args:
    - +define+COMPLETE_TC
  hooks:
    before:
      continue_on_error: false

run:
  args:
    - +ntb_random_seed=$ESIM_DEMO_SEED
    - +ESIM_DEMO_CASE=complete
  enabled: true
  hooks:
    before:
      commands:
        - echo "yyy testcase-entry run before"
    after:
      commands:
        - echo "yyy testcase-entry run after"
