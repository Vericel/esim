repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: full-quality-gates
        name: full quality gates
        entry: bash scripts/check.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
