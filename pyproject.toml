[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esim"
version = "0.2.0"
description = "Verilog/SystemVerilog filelist flattener"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["botticelle-onelog>=0.1,<0.2"]

[project.scripts]
ff = "ff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
