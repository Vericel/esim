[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esim"
version = "0.2.0"
description = "Verilog/SystemVerilog filelist flattener"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onelogg>=0.1.2,<0.2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "markdown-it-py==4.2.0",
    "pre-commit==4.6.1",
    "Pygments==2.20.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "setuptools==84.0.0",
    "wheel==0.47.0",
]

[project.scripts]
ff = "ff.cli:main"
esim = "esim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["ff", "esim"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
